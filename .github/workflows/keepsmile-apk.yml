name: Build Keepsmile Wi-Fi Lights APK

on:
  workflow_dispatch:
  push:
    branches: [claude/keepsmile-wifi-lights-xxkkj6]
    paths: ['keepsmile-wifi-lights/**', '.github/workflows/keepsmile-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keepsmile-wifi-lights
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: keepsmile-wifi-lights-debug-apk
          path: keepsmile-wifi-lights/app/build/outputs/apk/debug/app-debug.apk
